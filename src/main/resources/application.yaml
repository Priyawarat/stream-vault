spring:
  application:
    name: streamvault

  datasource:
    url: jdbc:postgresql://localhost:5432/streamvault
    username: postgres
    password: priye223@

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8080

storage:
  location: uploads

logging:
  level:
    com.priye.streamvault: DEBUG